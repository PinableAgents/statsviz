on: [push, pull_request]
name: Tests-linux
jobs:
  tests-linux:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: Tests
        run: |
          set -o pipefail
          if ! go test -race -shuffle=on ./... 2>&1 | tee "$RUNNER_TEMP/statsviz-tests.log"; then
            {
              echo '### Failed Go tests'
              echo '```text'
              go version
              tail -c 900000 "$RUNNER_TEMP/statsviz-tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostics="$(tail -c 60000 "$RUNNER_TEMP/statsviz-tests.log")"
            diagnostics="${diagnostics//%/%25}"
            diagnostics="${diagnostics//$'\r'/%0D}"
            diagnostics="${diagnostics//$'\n'/%0A}"
            printf '::error title=Go test failure::%s\n' "$diagnostics"
            exit 1
          fi
