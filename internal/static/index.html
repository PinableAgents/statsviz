<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statsviz</title>
  </head>
  <body>
    <!-- Top Navbar -->
    <nav id="top-navbar" class="navbar navbar-expand-lg px-3">
      <div class="d-flex align-items-center">
        <span class="navbar-brand mb-0 h1">Statsviz</span>
      </div>

      <!-- Center controls -->
      <div
        class="center-controls d-flex flex-column flex-lg-row align-items-center gap-6 gap-lg-1 w-100"
      >
        <!-- Plots tags -->
        <div class="w-100 w-lg-auto d-flex justify-content-center">
          <div
            id="navCategories"
            class="btn-group navCategories nav-radio"
            role="group"
          >
            <div
              class="btn-group"
              role="group"
              data-i18n-aria-label="Plot categories"
              aria-label="Plot categories"
            >
              <input
                type="checkbox"
                class="btn-check"
                id="tag-cpu"
                data-tag="cpu"
                autocomplete="off"
              />
              <label
                class="btn btn-sm btn-outline-secondary"
                for="tag-cpu"
                data-i18n-title="Alt+Click to show only this category"
                title="Alt+Click to show only this category"
                data-bs-toggle="tooltip"
                data-bs-delay='{"show":100,"hide":100}'
                >CPU</label
              >

              <input
                type="checkbox"
                class="btn-check"
                id="tag-gc"
                data-tag="gc"
                autocomplete="off"
              />
              <label
                class="btn btn-sm btn-outline-secondary"
                for="tag-gc"
                data-i18n-title="Alt+Click to show only this category"
                title="Alt+Click to show only this category"
                data-bs-toggle="tooltip"
                data-bs-delay='{"show":100,"hide":100}'
                >GC</label
              >

              <input
                type="checkbox"
                class="btn-check"
                id="tag-scheduler"
                data-tag="scheduler"
                autocomplete="off"
                checked
              />
              <label
                class="btn btn-sm btn-outline-secondary"
                for="tag-scheduler"
                data-i18n-title="Alt+Click to show only this category"
                title="Alt+Click to show only this category"
                data-bs-toggle="tooltip"
                data-bs-delay='{"show":100,"hide":100}'
                data-i18n="Scheduler"
                >Scheduler</label
              >

              <input
                type="checkbox"
                class="btn-check"
                id="tag-misc"
                data-tag="misc"
                autocomplete="off"
                checked
              />
              <label
                class="btn btn-sm btn-outline-secondary"
                for="tag-misc"
                data-i18n-title="Alt+Click to show only this category"
                title="Alt+Click to show only this category"
                data-bs-toggle="tooltip"
                data-bs-delay='{"show":100,"hide":100}'
                data-i18n="Misc"
                >Misc</label
              >
            </div>
          </div>
        </div>

        <!-- Search by metric name -->
        <div
          class="d-flex ms-lg-2 me-lg-2 w-100 w-lg-auto justify-content-center"
        >
          <input
            type="text"
            id="plot-search"
            class="form-control form-control-sm"
            data-i18n-placeholder="Type a metric or plot name..."
            placeholder="Type a metric or plot name..."
            data-i18n-aria-label="Search by metric or plot name"
            aria-label="Search by metric or plot name"
            style="width: 400px; max-width: 100%"
          />
        </div>

        <!-- Time range -->
        <div class="w-100 w-lg-auto d-flex justify-content-center align-items-center gap-2">
          <div class="btn-group nav-radio" role="group" data-i18n-aria-label="Time range" aria-label="Time range">
            <input
              type="radio"
              class="btn-check"
              name="range"
              id="range1"
              value="60"
              autocomplete="off"
              checked
            />
            <label
              class="btn btn-sm btn-outline-secondary"
              for="range1"
              data-bs-toggle="tooltip"
              data-i18n-title="Last 1 minute"
              title="Last 1 minute"
              >1m</label
            >
            <input
              type="radio"
              class="btn-check"
              name="range"
              id="range5"
              value="300"
              autocomplete="off"
            />
            <label
              class="btn btn-sm btn-outline-secondary"
              for="range5"
              data-bs-toggle="tooltip"
              data-i18n-title="Last 5 minutes"
              title="Last 5 minutes"
              >5m</label
            >
            <input
              type="radio"
              class="btn-check"
              name="range"
              id="range10"
              value="600"
              autocomplete="off"
            />
            <label
              class="btn btn-sm btn-outline-secondary"
              for="range10"
              data-bs-toggle="tooltip"
              data-i18n-title="Last 10 minutes"
              title="Last 10 minutes"
              >10m</label
            >
          </div>
          <button id="history-toggle" class="btn btn-sm btn-outline-secondary text-nowrap" type="button" aria-controls="history-panel" aria-expanded="false" hidden data-i18n="View history">View history</button>
        </div>

        <div
          class="w-100 w-lg-auto d-flex justify-content-center align-items-center gap-2"
        >
          <!-- GC events -->
          <input
            type="checkbox"
            class="btn-check"
            id="btn-gc-events"
            checked
            autocomplete="off"
          />
          <label
            class="btn btn-sm btn-outline-secondary"
            for="btn-gc-events"
            data-bs-toggle="tooltip"
            data-i18n-title="Show/hide GC events"
            data-i18n-aria-label="Show/hide GC events"
            title="Show/hide GC events"
            ><svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"
              />
            </svg>
          </label>
          <br />

          <!-- Play/Pause -->
          <input
            type="checkbox"
            class="btn-check"
            id="btn-play"
            checked
            autocomplete="off"
          />
          <label
            class="btn btn-sm btn-outline-secondary"
            for="btn-play"
            data-bs-toggle="tooltip"
            data-i18n-title="Pause/Resume Live Updates"
            data-i18n-aria-label="Pause/Resume Live Updates"
            title="Pause/Resume Live Updates"
            ><svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"
              />
            </svg>
          </label>
          <br />
        </div>
      </div>

      <!-- Links and options -->
      <div class="navbar-options d-flex align-items-center gap-3">
        <select id="language-select" class="language-select form-select form-select-sm" data-language-select data-i18n-aria-label="Language" aria-label="Language">
          <option value="zh" lang="zh-CN">中文</option>
          <option value="en" lang="en">English</option>
        </select>
        <a
          href="https://pkg.go.dev/runtime/metrics"
          target="_blank"
          class="text-decoration-none"
          data-i18n-title="runtime/metrics documentation"
          title="runtime/metrics documentation"
          data-i18n-aria-label="runtime/metrics documentation"
          aria-label="runtime/metrics documentation"
        >
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"
            />
          </svg>
        </a>
        <a
          href="https://github.com/PinableAgents/statsviz"
          target="_blank"
          class="text-decoration-none"
          data-i18n-title="PinableAgents/statsviz on GitHub"
          title="PinableAgents/statsviz on GitHub"
          data-i18n-aria-label="PinableAgents/statsviz on GitHub"
          aria-label="PinableAgents/statsviz on GitHub"
        >
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
            />
          </svg>
        </a>

        <div class="w-100 w-lg-auto">
          <input
            type="checkbox"
            class="btn-check"
            id="btn-darkmode"
            checked
            autocomplete="off"
          />
          <label
            class="btn btn-sm btn-outline-secondary"
            for="btn-darkmode"
            data-bs-toggle="tooltip"
            data-i18n-title="Light/Dark mode"
            data-i18n-aria-label="Light/Dark mode"
            title="Light/Dark mode"
            ><svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"
              />
            </svg>
          </label>
          <br />
        </div>
      </div>
    </nav>

    <section id="history-panel" class="history-panel" data-i18n-aria-label="History time controls" aria-label="History time controls" hidden>
      <div class="history-row">
        <span id="history-mode" class="badge text-bg-success" data-i18n="Following live">Following live</span>
        <div class="btn-group nav-radio" role="group" data-i18n-aria-label="History time range" aria-label="History time range">
          <input type="radio" class="btn-check" name="range" id="range60" value="3600" autocomplete="off" disabled />
          <label class="btn btn-sm btn-outline-secondary" for="range60">1h</label>
          <input type="radio" class="btn-check" name="range" id="range360" value="21600" autocomplete="off" disabled />
          <label class="btn btn-sm btn-outline-secondary" for="range360">6h</label>
          <input type="radio" class="btn-check" name="range" id="range1440" value="86400" autocomplete="off" disabled />
          <label class="btn btn-sm btn-outline-secondary" for="range1440">24h</label>
          <input type="radio" class="btn-check" name="range" id="range10080" value="604800" autocomplete="off" disabled />
          <label class="btn btn-sm btn-outline-secondary" for="range10080">7d</label>
        </div>
        <span id="history-status" class="history-status" role="status" data-i18n="Checking history availability…">Checking history availability…</span>
        <button id="history-prev" class="btn btn-sm btn-outline-secondary" type="button" disabled data-i18n="← Earlier">← Earlier</button>
        <button id="history-next" class="btn btn-sm btn-outline-secondary" type="button" disabled data-i18n="Later →">Later →</button>
      </div>
      <div class="history-row history-range-row">
        <label for="history-from" data-i18n="From">From</label>
        <input id="history-from" class="form-control form-control-sm" type="datetime-local" step="1" disabled />
        <label for="history-to" data-i18n="To">To</label>
        <input id="history-to" class="form-control form-control-sm" type="datetime-local" step="1" disabled />
        <button id="history-apply" class="btn btn-sm btn-outline-primary" type="button" disabled data-i18n="Query">Query</button>
        <input id="history-slider" class="form-range" type="range" min="0" max="0" value="0" data-i18n-aria-label="History window position" aria-label="History window position" disabled />
      </div>
      <div class="history-row point-row">
        <label for="history-point-at" data-i18n="Time">Time</label>
        <input id="history-point-at" class="form-control form-control-sm" type="datetime-local" step="0.001" disabled />
        <button id="history-point-query" class="btn btn-sm btn-outline-primary" type="button" disabled data-i18n="View actual sample">View actual sample</button>
        <span class="history-hint" data-i18n="Click any chart to synchronize the cursor">Click any chart to synchronize the cursor</span>
      </div>
      <div id="history-granularity" class="history-granularity"></div>
    </section>

    <div id="point-details" class="modal fade" tabindex="-1" aria-labelledby="point-details-title" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header gap-3">
            <h5 id="point-details-title" class="modal-title me-auto" data-i18n="Sample details">Sample details</h5>
            <select id="detail-language-select" class="language-select form-select form-select-sm" data-language-select data-i18n-aria-label="Language" aria-label="Language">
              <option value="zh" lang="zh-CN">中文</option>
              <option value="en" lang="en">English</option>
            </select>
            <button type="button" class="btn-close ms-0" data-bs-dismiss="modal" data-i18n-aria-label="Close" aria-label="Close"></button>
          </div>
          <div id="point-detail-content" class="modal-body" data-i18n="No sample selected">No sample selected</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="Close">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex flex-grow-1">
      <!-- Main Content -->
      <main id="main-content" class="w-100">
        <div class="plots-container" id="plots"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
